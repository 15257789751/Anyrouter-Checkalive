name: Anyrouter Keepalive (Once)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'API Base URL'
        required: false
        default: 'https://anyrouter.top'
      model:
        description: 'Model for health checks'
        required: false
        default: 'gpt-6-astra'

jobs:
  keepalive-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Codex CLI
        run: |
          sudo npm install -g @openai/codex
          codex --version

      - name: Run Codex Keepalive
        env:
          ANYROUTER_TOKENS: ${{ secrets.ANYROUTER_TOKENS }}
          BASE_URL: ${{ github.event.inputs.base_url || 'https://anyrouter.top' }}
          MODEL: ${{ github.event.inputs.model || 'gpt-6-astra' }}
        run: |
          BASE_URL="${BASE_URL%/}"
          if [[ "$BASE_URL" != */v1 ]]; then
            BASE_URL="${BASE_URL}/v1"
          fi

          echo "=========================================="
          echo "Using Codex CLI Client"
          echo "Base URL: $BASE_URL"
          echo "Model: $MODEL"
          echo "=========================================="

          mkdir -p ~/.codex

          IFS=$'\n,'
          for token in $ANYROUTER_TOKENS; do
            token=$(echo "$token" | xargs)
            if [ -z "$token" ]; then continue; fi

            echo "Testing Token: ${token:0:8}****** with Codex CLI..."

            echo "model = \"$MODEL\"" > ~/.codex/config.toml
            echo "model_provider = \"anyrouter\"" >> ~/.codex/config.toml
            echo "" >> ~/.codex/config.toml
            echo "[model_providers.anyrouter]" >> ~/.codex/config.toml
            echo "name = \"AnyRouter\"" >> ~/.codex/config.toml
            echo "base_url = \"$BASE_URL\"" >> ~/.codex/config.toml
            echo "wire_api = \"responses\"" >> ~/.codex/config.toml
            echo "env_key = \"CODEX_ANYROUTER_KEY\"" >> ~/.codex/config.toml
            echo "requires_openai_auth = false" >> ~/.codex/config.toml

            export CODEX_ANYROUTER_KEY="$token"

            codex exec "What is 144 divided by 12? Reply with just the number."

            echo ">>> [SUCCESS] Token: ${token:0:8}****** 通过 Codex 客户端保活成功！"
            echo "=========================================="
          done
